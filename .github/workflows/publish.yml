# Publishes site/ to GitHub Pages at https://offtrail-tales.github.io/.
# Nothing else in this repository is served.
#
# Two switches keep the site offline until the owner decides:
#   1. Settings > Pages > Source: "GitHub Actions". Pages is off until then.
#   2. Settings > Secrets and variables > Actions > Variables:
#      PAGES_LIVE = true.
# With both on, "Run workflow" (gh workflow run "Publish site") publishes
# the current site/. The force-push of a new build does not start it on its
# own. Without PAGES_LIVE the job is skipped.
#
# Actions are pinned to commits, so a moved tag cannot change what runs.
name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PAGES_LIVE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same checks as the publish script in the source repository: the
      # page has its security policy, and there is no server-side code.
      - name: Check site/
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' site/index.html
          if find site -type f \( -iname '*.php*' -o -iname '*.phtml' -o -iname '*.phar' -o -iname '*.cgi' -o -name '.htaccess' \) | grep -q .; then
            echo "site/ holds server-side files"
            exit 1
          fi

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The app keeps players' data in their browser, per address, so it
      # runs only at an address of its own: this organization's Pages site,
      # which serves nothing else.
      - name: Publish only to https://offtrail-tales.github.io
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          if [ "$ORIGIN" != "https://offtrail-tales.github.io" ]; then
            echo "The site would be served at '$ORIGIN', not at https://offtrail-tales.github.io."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check the live site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$URL" | grep -q 'http-equiv="Content-Security-Policy"' &&
              curl -fsS "${URL}tales/catalog.json" > /dev/null; then
              echo "Live: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "The live site does not answer as expected: $URL"
          exit 1
